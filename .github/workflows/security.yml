name: DevSecOps Security Pipeline

on: [push]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Bandit Scan
      uses: py-actions/bandit@v1
      with:
        path: .

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: python:3.8
